name: Android CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: pwsh
        run: '& "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" "platforms;android-36" "build-tools;36.0.0"'

      - name: Test, lint and build
        shell: pwsh
        run: .\scripts\build.ps1

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: TVAutoPlayer-v1.1.2-debug
          path: dist/TVAutoPlayer-v1.1.2-debug.apk
          if-no-files-found: error
